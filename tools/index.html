<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>虚拟货架测试台</title>
    <link rel="stylesheet" href="../app/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>虚拟货架测试台</h1>
        <p>模拟已经贴好标签的货架、物品和重量码；手机 App 只能扫码走真实流程。</p>
      </div>
      <button id="newBatch" type="button" class="ghost">生成新测试批次</button>
    </header>

    <main class="virtual-lab">
      <section class="tool-panel lab-summary">
        <div>
          <span class="label">当前测试批次</span>
          <strong id="batchName">TEST</strong>
        </div>
        <div>
          <span class="label">二维码协议</span>
          <strong>v1 / Q 纠错</strong>
        </div>
        <div>
          <span class="label">默认库位</span>
          <strong id="locationName">测试库位</strong>
        </div>
      </section>

      <section class="virtual-stage" aria-label="虚拟货架">
        <div class="shelf-frame">
          <div class="shelf-top">
            <div>
              <span>货架 A</span>
              <strong>测试库位</strong>
            </div>
            <div id="locationQr" class="qr-label shelf-location-label"></div>
          </div>

          <div class="shelf-level">
            <div id="spoolCard" class="shelf-item spool-item"></div>
            <div id="partCard" class="shelf-item parts-item"></div>
          </div>

          <div class="shelf-level lower">
            <div id="otherCard" class="shelf-item tool-item"></div>
            <div class="scale-block">
              <div>
                <span class="label">模拟电子秤</span>
                <strong>重量二维码</strong>
              </div>
              <div id="weightGrid" class="weight-grid"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="tool-panel">
        <div class="tool-section-head">
          <h2>推荐扫码顺序</h2>
          <p class="tool-subtitle">二维码默认遮盖；鼠标悬停或点击标签显示二维码。</p>
        </div>
        <div id="flowGrid" class="flow-grid"></div>
      </section>
    </main>

    <script src="./vendor/qrcode-generator.js"></script>
    <script type="module" src="./tools.js"></script>
  </body>
</html>
